[package]
name = "stimma-seamless-patch"
version = "0.1.0"
edition = "2021"
publish = false
description = "WASM gradient-domain solver for Stimma's image Patch tool"
license = "AGPL-3.0-only"
repository = "https://github.com/stimma-ai/stimma"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.108"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
# Rust already emits an optimized/LTO module above. wasm-pack's downloaded
# Binaryen build currently rejects bulk-memory opcodes emitted by this Rust
# toolchain, so do not run that redundant and incompatible post-pass.
wasm-opt = false
